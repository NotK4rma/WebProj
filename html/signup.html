<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Adoption - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/signup.css">

</head>
<body>
    <header>
        <div class="logo">
            <img src="../img/logo-nobg.png" alt="Pet Adoption Logo" class="logo-pic">
            <h1>AdoptiPet</h1>
        </div>
    </header>

    <div class="main-content">
        <div class="signup-container">
            <div class="signup-header">
                <h2>Create an Account</h2>
                <p>Join us to find and adopt your perfect companion</p>
            </div>

            <form class="signup-form" action="../php/signupValidation.php" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" required placeholder="Enter your first name">
                    </div>

                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" required placeholder="Enter your last name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Create a password">
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm your password">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <select id="location" name="location">
                            <option value="" disabled selected>Select your location</option>
                            <option value="tunis">Tunis</option>
                            <option value="sfax">Sfax</option>
                            <option value="sousse">Sousse</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="pet-preference">
                    <div class="preference-title">What pets are you interested in?</div>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="dogs" name="pet-preference" value="dogs">
                            <label for="dogs">Dogs</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="cats" name="pet-preference" value="cats">
                            <label for="cats">Cats</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="birds" name="pet-preference" value="birds">
                            <label for="birds">Birds</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="rabbits" name="pet-preference" value="rabbits">
                            <label for="rabbits">Rabbits</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="small-animals" name="pet-preference" value="small-animals">
                            <label for="small-animals">Small Animals</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="other-pets" name="pet-preference" value="other">
                            <label for="other-pets">Other</label>
                        </div>
                    </div>
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>

                <button type="submit" class="signup-btn" id="signup-btn">Create Account</button>
            </form>

            <div class="divider">
                <span>or sign up with</span>
            </div>

            <div class="social-signup">
                <a href="#" class="social-btn fb">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" class="social-btn google">
                    <i class="fab fa-google"></i>
                </a>
                <a href="#" class="social-btn twitter">
                    <i class="fab fa-twitter"></i>
                </a>
            </div>

            <div class="login-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>
    <div id="error-popup" class="error-popup">
        <div class="error-popup-content">
            <div class="error-header">
                <h3><i class="fas fa-exclamation-circle"></i> Oops! There was a problem</h3>
                <span class="close-btn">&times;</span>
            </div>
            <div class="error-body">
                <ul class="error-list">

                </ul>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var errorPopup = document.getElementById("error-popup");
        
            var closeBtn = document.querySelector(".close-btn");
            closeBtn.addEventListener("click", function() {
                errorPopup.classList.remove("show");
                setTimeout(function() {
                    errorPopup.style.display = "none";
                }, 300);
            });
    
            setTimeout(function() {
                errorPopup.classList.remove("show");
                setTimeout(function() {
                    errorPopup.style.display = "none";
                }, 300);
            }, 8000);
        });
    </script>
    
    <link rel="stylesheet" href="../css/error.css">

    <footer>
        <p>&copy; 2025 Pet Adoption. All rights reserved.</p>
    </footer>
    <script src="../js/scnd.js"></script>
</body>
</html>
